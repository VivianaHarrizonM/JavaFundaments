<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
    <h:head>
        <meta charset="UTF-8"/>
        <title>ManagedBeans en JSF</title>
    </h:head>
    <h:body>
        <h:form>
            <table>
                <tr>
                    <td><h:outputLabel for="nombre" value="Nombre"/></td>
                    <td><h:inputText id="nombre" value="#{candidato.nombre}"/></td>
                    <td><h:messages for="nombre"/></td>
                </tr>
                <tr>
                    <td><h:outputLabel value="Resultado:"/></td>
                    <td><h:outputText value="#{candidato.nombre}"/></td>
                </tr>
                <tr>
                    <td colspan="2"><h:commandButton value="Enviar"/></td>
                </tr>
            </table>
        </h:form>
    </h:body>
</html>
